name: zelacidade-orbital-rm558710
services:
  db:
    image: postgres:16-bookworm
    container_name: zelacidade-orbital-db-rm558710
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbital
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crie .env com uma senha forte}
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - orbital-data:/var/lib/postgresql/data
      - ./scripts/script-bd.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - orbital-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital -d orbital"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: zelacidade-orbital-rm558710:gs2026-1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zelacidade-orbital-app-rm558710
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=orbital;Username=orbital;Password=${POSTGRES_PASSWORD:?Crie .env com uma senha forte}
    ports:
      - "8080:8080"
    networks:
      - orbital-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 15s
      retries: 20
      start_period: 10s
volumes:
  orbital-data:
    name: zelacidade-orbital-data-rm558710
networks:
  orbital-net:
    name: zelacidade-orbital-net-rm558710
    driver: bridge
